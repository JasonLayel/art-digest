# Asks a source what it will answer without credentials, so design decisions
# rest on measurement rather than on what its API used to do.
name: Probe a source

on:
  workflow_dispatch:
    inputs:
      artstation_user:
        description: 'ArtStation username to probe (blank to skip)'
        required: false
        default: 'jasonlayel'
      artstation_churn:
        description: 'Sample the latest feed twice to see whether it moves (slow)'
        required: false
        default: 'false'
      pinterest_user:
        description: 'Pinterest username, profile URL or pin.it link (blank to skip)'
        required: false
        default: ''
      pinterest_board:
        description: 'Optional Pinterest board slug'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe ArtStation
        if: inputs.artstation_user != ''
        env:
          # Optional: an ArtStation session cookie makes these authenticated
          # requests, the way PIXIV_SESSION does for Pixiv.
          ARTSTATION_COOKIE: ${{ secrets.ARTSTATION_COOKIE }}
        run: node tools/probe-artstation.mjs "${{ inputs.artstation_user }}"

      - name: Is ArtStation's latest feed ordered by upload?
        if: inputs.artstation_churn == 'true'
        run: node tools/probe-artstation-churn.mjs

      - name: Probe Pinterest
        if: inputs.pinterest_user != ''
        run: node tools/probe-pinterest.mjs "${{ inputs.pinterest_user }}" "${{ inputs.pinterest_board }}"
